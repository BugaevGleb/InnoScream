services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: inno-scream-api
    networks:
      - app-network
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    env_file:
      - .env

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    container_name: inno-scream-bot
    networks:
      - app-network
    env_file:
      - .env
    depends_on:
      - api

networks:
  app-network:
    driver: bridge
