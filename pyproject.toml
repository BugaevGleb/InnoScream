[project]
name = "InnoScream"
version = "0.1.0"
description = "Toy project for Innopolis University S25 \"Software Quality, Reliability and Security\" course"
authors = [
    { name = "Gleb Bugaev", email = "g.bugaev@innopolis.university" },
    { name = "Vladislav Bolshakov", email = "v.bolshakov@innopolis.university" },
    { name = "Nail Minnemullin", email = "n.minnemullin@innopolis.university" },
    { name = "Milana Sirozhova", email = "m.sirozhova@innopolis.university" },
    { name = "Dmitriy Okoneshnikov", email = "d.okoneshnikov@innopolis.university" },
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard] (>=0.115.12,<0.116.0)",
    "pydantic (>=2.11.3,<3.0.0)",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "sqlmodel (>=0.0.24,<0.0.25)",
    "sqlalchemy (>=2.0.40,<3.0.0)",
    "aiogram (>=3.20.0.post0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
flake8 = "^7.2.0"
bandit = "^1.8.3"
locust = "^2.35.0"
mutmut = "^3.2.3"
pydocstyle = "^6.3.0"
radon = "^6.0.1"
pre-commit = "^4.2.0"
flake8-pyproject = "^1.2.3"

[tool.flake8]
# through Flake8-pyproject
radon-max-cc = 10

[tool.bandit]
severity-level = "high"
skips = ["B101", "B311"]

[tool.pydocstyle]
convention = "google"
add_ignore = ["D100", "D101", "D104"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
