name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Poetry
        run: pip install --no-cache-dir poetry

      - name: Install dependencies
        run: poetry install

      - name: Run flake8 (with radon in custom config)
        run: poetry run flake8

      - name: Run pydocstyle
        run: poetry run pydocstyle

      - name: Run pytest
        run: poetry run pytest

      - name: Run bandit
        run: poetry run bandit -r app -lll -c pyproject.toml
